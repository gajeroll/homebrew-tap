name: Cask audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: brew style and audit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Tap this repository
        run: |
          brew tap gajeroll/tap "$(pwd)"
      - name: Style
        run: brew style --cask gajeroll/tap
      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --online --tap=gajeroll/tap
